  **#437 骨架（2026-06-18）**：Approve once 仅当次 · Approve for session 写入
  `sessionApprovalRule` + `localSessionApprovalRulePatterns` · TUI 队列同 action
  在 scope=session 时可 autoResolve（controller.autoResolveFor）。

